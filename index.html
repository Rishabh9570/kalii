<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Will You Be My Valentine? 💖</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Indie+Flower&family=Dancing+Script:wght@400;700&family=Nunito:wght@300;400;600&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Nunito', sans-serif;
            background: linear-gradient(135deg, #ffb6e1 0%, #d9b8ff 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
            color: #5a2d5a;
            transition: background-color 1s ease;
        }

        .container {
            max-width: 500px;
            width: 100%;
            text-align: center;
            padding: 25px;
            background-color: rgba(255, 255, 255, 0.85);
            border-radius: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(10px);
            position: relative;
            z-index: 10;
            margin-top: 60px;
        }

        h1 {
            font-family: 'Dancing Script', cursive;
            font-size: 3.2rem;
            color: #d32f8e;
            margin-bottom: 25px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
            line-height: 1.2;
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 30px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 16px 32px;
            font-size: 1.4rem;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-family: 'Indie Flower', cursive;
            font-weight: bold;
            transition: all 0.3s ease;
            min-width: 140px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .yes-btn {
            background: linear-gradient(to right, #ff6b9d, #ff8fab);
            color: white;
            transform: scale(1);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .yes-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 20px rgba(255, 107, 157, 0.3);
        }

        .no-btn {
            background: linear-gradient(to right, #b19cd9, #d0b8ff);
            color: white;
            position: relative;
        }

        .no-btn:hover {
            transform: translateY(-3px);
        }

        .message {
            margin-top: 25px;
            min-height: 60px;
            font-size: 1.4rem;
            font-family: 'Indie Flower', cursive;
            color: #9c2b7d;
            padding: 10px;
            transition: all 0.5s ease;
        }

        /* Kitten animation */
        .kitten-container {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 120px;
            height: 180px;
            z-index: 5;
        }

        .kitten {
            position: absolute;
            width: 80px;
            height: 80px;
            background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="50" cy="50" r="45" fill="%23FFB6C1"/><circle cx="35" cy="40" r="8" fill="%235a2d5a"/><circle cx="65" cy="40" r="8" fill="%235a2d5a"/><path d="M35 70 Q50 85 65 70" stroke="%235a2d5a" stroke-width="3" fill="none"/><path d="M20 30 Q30 15 40 30" stroke="%235a2d5a" stroke-width="2" fill="none"/><path d="M60 30 Q70 15 80 30" stroke="%235a2d5a" stroke-width="2" fill="none"/></svg>') no-repeat center;
            background-size: contain;
            bottom: 0;
            left: 20px;
            animation: float 4s ease-in-out infinite;
        }

        .balloon {
            position: absolute;
            width: 50px;
            height: 60px;
            background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><path d="M50 15 C70 15,85 30,85 50 C85 70,70 85,50 85 C30 85,15 70,15 50 C15 30,30 15,50 15 Z" fill="%23FF6B9D"/><path d="M50 85 L50 100" stroke="%235a2d5a" stroke-width="3"/></svg>') no-repeat center;
            background-size: contain;
            top: 0;
            left: 35px;
            animation: floatBalloon 4s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(-2deg); }
            50% { transform: translateY(-20px) rotate(2deg); }
        }

        @keyframes floatBalloon {
            0%, 100% { transform: translateY(0) rotate(5deg); }
            50% { transform: translateY(-25px) rotate(-5deg); }
        }

        /* Celebration screen */
        .celebration {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #ff8fab 0%, #ffccd5 100%);
            z-index: 100;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            text-align: center;
        }

        .celebration h2 {
            font-family: 'Dancing Script', cursive;
            font-size: 3.5rem;
            color: #9c2b7d;
            margin-bottom: 30px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
        }

        .celebration p {
            font-size: 1.5rem;
            color: #5a2d5a;
            margin-bottom: 40px;
            max-width: 80%;
        }

        /* Floating hearts */
        .heart {
            position: absolute;
            font-size: 24px;
            color: #ff6b9d;
            opacity: 0.7;
            animation: floatHeart 5s linear infinite;
        }

        @keyframes floatHeart {
            0% {
                transform: translateY(100vh) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 0.8;
            }
            90% {
                opacity: 0.8;
            }
            100% {
                transform: translateY(-100px) rotate(360deg);
                opacity: 0;
            }
        }

        /* Mobile optimizations */
        @media (max-width: 600px) {
            h1 {
                font-size: 2.6rem;
            }
            
            .container {
                padding: 20px;
            }
            
            .btn {
                font-size: 1.2rem;
                padding: 14px 24px;
                min-width: 120px;
            }
            
            .celebration h2 {
                font-size: 2.8rem;
            }
            
            .kitten-container {
                width: 100px;
                height: 150px;
            }
        }

        @media (max-width: 400px) {
            h1 {
                font-size: 2.2rem;
            }
            
            .buttons {
                flex-direction: column;
                align-items: center;
            }
            
            .btn {
                width: 90%;
            }
        }

        /* Glow effect for Yes button */
        .glow {
            animation: glow 1.5s infinite alternate;
        }

        @keyframes glow {
            from {
                box-shadow: 0 0 10px #ff6b9d, 0 0 20px #ff6b9d, 0 5px 15px rgba(0, 0, 0, 0.1);
            }
            to {
                box-shadow: 0 0 15px #ff8fab, 0 0 30px #ff8fab, 0 8px 25px rgba(0, 0, 0, 0.15);
            }
        }
    </style>
</head>
<body>
    <!-- Main screen -->
    <div class="container">
        <h1>Will you be my Valentine? 💖</h1>
        
        <div class="message" id="message">
            Click a button to respond... 💕
        </div>
        
        <div class="buttons">
            <button class="btn yes-btn" id="yesBtn">Yes 💖</button>
            <button class="btn no-btn" id="noBtn">Nah 🥺</button>
        </div>
        
        <div class="kitten-container">
            <div class="balloon"></div>
            <div class="kitten"></div>
        </div>
    </div>
    
    <!-- Celebration screen -->
    <div class="celebration" id="celebration">
        <h2>Yayyy! You're my Valentine 🌹💖</h2>
        <p>This is the beginning of something beautiful with my adorable shortiee... 💕</p>
        <div class="buttons">
            <button class="btn yes-btn" id="restartBtn">That's My shortieee pookieeeee cutieeee 🫠💝</button>
        </div>
    </div>
    
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Get DOM elements
            const yesBtn = document.getElementById('yesBtn');
            const noBtn = document.getElementById('noBtn');
            const messageEl = document.getElementById('message');
            const celebrationEl = document.getElementById('celebration');
            const restartBtn = document.getElementById('restartBtn');
            const body = document.body;
            
            // Messages for Nah button
            const messages = [
                "Are you sure aap accept nhi karenge!!? 🥺",
                "Please don't break my heart 💔",
                "I made this just for you 🌸",
                "Okay… one more chance? otherwise tera maggie 2 min ke instead 50 min me bane😭",
                "I'll wait… 💗",
                "Cutie please na? 🥰",
                "You're my shortiee na 💕",
                "I'll be really sad... 😢",
                "Just say yes! 😘",
                "Finally bol de na pleaseee🥺! 🌟"
            ];
            
            let messageIndex = 0;
            let yesBtnScale = 1;
            let noBtnClicks = 0;
            
            // Function to create floating hearts
            function createHearts(count) {
                for (let i = 0; i < count; i++) {
                    const heart = document.createElement('div');
                    heart.classList.add('heart');
                    heart.innerHTML = '❤️';
                    heart.style.left = Math.random() * 100 + 'vw';
                    heart.style.fontSize = (Math.random() * 30 + 20) + 'px';
                    heart.style.animationDuration = (Math.random() * 4 + 6) + 's';
                    heart.style.animationDelay = Math.random() * 5 + 's';
                    body.appendChild(heart);
                    
                    // Remove heart after animation completes
                    setTimeout(() => {
                        heart.remove();
                    }, 10000);
                }
            }
            
            // Start with some floating hearts in the background
            createHearts(8);
            
            // No button click handler
            noBtn.addEventListener('click', function() {
                // Change message
                messageEl.textContent = messages[messageIndex];
                messageEl.style.transform = 'scale(1.1)';
                setTimeout(() => {
                    messageEl.style.transform = 'scale(1)';
                }, 300);
                
                // Move button randomly
                const x = Math.random() * 80 - 40;
                const y = Math.random() * 80 - 40;
                noBtn.style.transform = `translate(${x}px, ${y}px)`;
                
                // Increment message index, loop if needed
                messageIndex = (messageIndex + 1) % messages.length;
                
                // Make Yes button more attractive
                noBtnClicks++;
                yesBtnScale += 0.05;
                yesBtn.style.transform = `scale(${yesBtnScale})`;
                
                // Add glow effect after 3 clicks
                if (noBtnClicks >= 3) {
                    yesBtn.classList.add('glow');
                }
                
                // Create a few hearts when Nah is clicked
                createHearts(3);
                
                // Playful sound effect (optional - using text feedback instead)
                console.log("Playful teasing sound effect");
            });
            
            // Yes button click handler
            yesBtn.addEventListener('click', function() {
                // Hide main container
                document.querySelector('.container').style.display = 'none';
                
                // Show celebration screen
                celebrationEl.style.display = 'flex';
                
                // Create lots of hearts for celebration
                createHearts(50);
                
                // Change background to celebration colors
                body.style.background = 'linear-gradient(135deg, #ff8fab 0%, #ffccd5 100%)';
                
                // Play celebration sound (optional)
                console.log("Celebration sound playing");
            });
            
            // Restart button handler
            restartBtn.addEventListener('click', function() {
                // Show main container
                document.querySelector('.container').style.display = 'block';
                
                // Hide celebration screen
                celebrationEl.style.display = 'none';
                
                // Reset everything
                messageIndex = 0;
                yesBtnScale = 1;
                noBtnClicks = 0;
                messageEl.textContent = "Click a button to respond... 💕";
                yesBtn.style.transform = 'scale(1)';
                noBtn.style.transform = 'translate(0, 0)';
                yesBtn.classList.remove('glow');
                body.style.background = 'linear-gradient(135deg, #ffb6e1 0%, #d9b8ff 100%)';
            });
            
            // Make the kitten follow mouse slightly on desktop
            document.addEventListener('mousemove', function(e) {
                if (window.innerWidth > 768) {
                    const kitten = document.querySelector('.kitten-container');
                    const x = (e.clientX / window.innerWidth - 0.5) * 20;
                    const y = (e.clientY / window.innerHeight - 0.5) * 20;
                    kitten.style.transform = `translateX(calc(-50% + ${x}px)) translateY(${y}px)`;
                }
            });
        });
    </script>
</body>
</html>
